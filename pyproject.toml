[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "meetingbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper>=20231117",
    "pyannote.audio>=3.1",
    "torch>=2.2",
    "torchaudio>=2.2",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "rumps>=0.4",
    "watchdog>=4.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock", "ruff"]

[project.scripts]
meetingbot        = "meetingbot.tray:main"
meetingbot-cli    = "meetingbot.open_report:cli"
meetingbot-worker = "meetingbot.worker:main"