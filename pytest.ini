# pytest.ini
# Place this file in the project root alongside pyproject.toml
# This is an alternative to putting pytest config in pyproject.toml
# Only use ONE of these — if you already have [tool.pytest.ini_options]
# in pyproject.toml, you do not need this file.

[pytest]
testpaths     = tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*
addopts       = -v --tb=short
markers =
    integration: tests that need real hardware (BlackHole + mic)
    slow: tests that load ML models (Whisper, pyannote)
log_cli       = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:torch
    ignore::FutureWarning:pyannote
    ignore::FutureWarning:torchaudio
